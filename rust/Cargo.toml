[package]
name = "robustcopy"
version = "1.1.0"
edition = "2024"
description = "A focused Windows desktop interface for reliable Robocopy file transfers."
authors = ["Kaleb Creative Studio"]
repository = "https://github.com/tnoahc/RobustCopy"
publish = false

# Match the name of the shipped WPF executable.
[[bin]]
name = "RobustCopy"
path = "src/main.rs"

[dependencies]
chrono = "0.4.45"
eframe = "0.37.0"
egui = "0.37.0"
regex = "1.13.1"
rfd = "0.17.2"
uuid = { version = "1.28.0", features = ["v4"] }

[target."cfg(windows)".dependencies]
raw-window-handle = "0.6"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_Security"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true

[build-dependencies]
winresource = "0.1.34"
