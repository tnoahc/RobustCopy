# GitLab CI pipeline for RobustCopy (issue #12).
#
# RobustCopy has two apps: RobustCopy 1, a WPF application (src/), and
# RobustCopy 2, its Rust rewrite (rust/). Both test suites drive the real
# C:\Windows\System32\robocopy.exe, so every job must run on a Windows shell
# runner using the PowerShell executor (shell = "powershell" or "pwsh").
# Docker executors cannot build WPF or run robocopy.

# Run pipelines for merge requests, the default branch, and tags (tags are
# needed for the release job). Pushes to other branches do not create branch
# pipelines, so a branch with an open merge request gets only one pipeline.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - build
  - test
  - release

variables:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  # Keep Rust build output outside the project directory, so the clean checkout
  # each job starts from does not delete it and cargo only rebuilds what changed.
  CARGO_TARGET_DIR: "$CI_BUILDS_DIR\\cargo-target\\$CI_PROJECT_PATH_SLUG"
  CARGO_TERM_COLOR: "never"

default:
  # PLACEHOLDER: the repository owner must confirm this tag matches the
  # registered Windows shell runner (PowerShell executor) that has the
  # .NET 10 SDK and robocopy.exe available.
  tags:
    - windows
  # Keep NuGet packages inside the project directory so GitLab can cache them.
  # GitLab cache paths must be relative to the project directory.
  cache:
    key:
      files:
        - src/RobustCopy/RobustCopy.csproj
        - tests/RobustCopy.Tests/RobustCopy.Tests.csproj
    paths:
      - .nuget/packages/
  before_script:
    # The shell executor runs before_script and script in the same PowerShell
    # session, so this also makes every cmdlet error in script fail the job.
    # Native commands do not throw, so each one is followed by an explicit
    # $LASTEXITCODE check. Jobs that override before_script set it again.
    - $ErrorActionPreference = "Stop"
    - $env:NUGET_PACKAGES = Join-Path $env:CI_PROJECT_DIR ".nuget\packages"
    # The .NET 10 SDK is expected to be preinstalled on the runner. The
    # commented-out steps below are kept only as a fallback for a runner
    # without it; uncomment them to install the SDK into the project directory.
    # - '[Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12'
    # - Invoke-WebRequest -Uri "https://dot.net/v1/dotnet-install.ps1" -OutFile "$env:TEMP\dotnet-install.ps1" -UseBasicParsing
    # - '& "$env:TEMP\dotnet-install.ps1" -Channel 10.0 -InstallDir "$env:CI_PROJECT_DIR\.dotnet"'
    # - $env:DOTNET_ROOT = "$env:CI_PROJECT_DIR\.dotnet"
    # - $env:PATH = "$env:DOTNET_ROOT;$env:PATH"
    - dotnet --info
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

build:
  stage: build
  script:
    - dotnet build RobustCopy.slnx --configuration Release
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

test:
  stage: test
  script:
    # The test runner exits non-zero when any test fails.
    - dotnet run --project tests\RobustCopy.Tests\RobustCopy.Tests.csproj --configuration Release
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

# The Rust jobs need the stable Rust toolchain for MSVC (rustup) and the Visual
# Studio Build Tools C++ workload with the Windows SDK on the runner.
.rust:
  cache: []
  before_script:
    - $ErrorActionPreference = "Stop"
    - if (-not (Get-Command cargo -ErrorAction SilentlyContinue)) { throw "cargo was not found. Install Rust (rustup, MSVC toolchain) and the Visual Studio Build Tools C++ workload on the runner." }
    - cargo --version
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

build-rust:
  extends: .rust
  stage: build
  script:
    - cargo build --release --locked --manifest-path rust\Cargo.toml
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

test-rust:
  extends: .rust
  stage: test
  script:
    # Includes the Robocopy integration tests in rust\tests\robocopy.rs.
    - cargo test --locked --manifest-path rust\Cargo.toml
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

# Tagged builds are released by ci/release.ps1:
# - v1.x.y tags release the WPF app, v2.x.y tags the Rust app; a -preview.N
#   suffix (v2.1.0-preview.1) makes a GitHub pre-release,
# - builds RobustCopy.exe and RobustCopy.exe.sha256,
# - pushes the tag to GitHub and creates the GitHub release with the exe,
#   checksum, and pdb (draft first, published once every file is uploaded),
# - creates the GitLab release with links to those GitHub files.
# The executable is not uploaded to GitLab: the instance sits behind a proxy
# that times out on uploads that large.
# Requirements: GITHUB_TOKEN as a masked, protected CI variable (fine-grained
# token, Contents: read and write on tnoahc/RobustCopy), and v* tags protected
# so that tag pipelines can read it.
release:
  stage: release
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-preview\.\d+)?$/
  variables:
    # A full clone, so the tag and its history can be pushed to GitHub.
    GIT_DEPTH: "0"
    GITHUB_REPOSITORY: tnoahc/RobustCopy
  script:
    - powershell -NoProfile -ExecutionPolicy Bypass -File ci\release.ps1
    - if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  artifacts:
    name: "RobustCopy-$CI_COMMIT_TAG-sha256"
    paths:
      - artifacts/publish/RobustCopy.exe.sha256
    expire_in: never
